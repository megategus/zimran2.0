<!-- @dsCard group="Car" height=760 subtitle="12 parts, one per course topic" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body)}
.w-grid{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.w-part{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.w-part.on{border:2px solid var(--brand);box-shadow:var(--press-brand)}
.w-part svg{width:96px;height:96px}
.w-name{font:700 15px/20px var(--font-display)}
.w-course{font:600 11px/14px var(--font-body);letter-spacing:.6px;text-transform:uppercase;color:var(--ink-muted)}
.w-tag{font:600 11px/14px var(--font-body);letter-spacing:.6px;text-transform:uppercase;background:var(--brand);color:var(--on-brand);padding:3px 8px;border-radius:var(--radius-sm)}
/* fills and strokes, all from tokens */
.s{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.f-brand{fill:var(--brand)}.f-amber{fill:var(--amber)}.f-brake{fill:var(--brake)}.f-plate{fill:var(--plate)}
.f-surf{fill:var(--surface)}.f-sunk{fill:var(--surface-sunken)}.f-soft{fill:var(--brand-soft)}.f-ink{fill:var(--ink)}
.l{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.l-mute{fill:none;stroke:var(--line-strong);stroke-width:4;stroke-linecap:round}
.spring{fill:none;stroke:var(--brand);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.cable{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round}
</style>
<div class="w-grid">

<div class="w-part on"><svg viewBox="0 0 96 96" role="img" aria-label="Brake rotor">
<circle class="f-sunk s" cx="48" cy="48" r="40"/>
<g class="f-ink"><circle cx="77.4" cy="65" r="3"/><circle cx="48" cy="82" r="3"/><circle cx="18.6" cy="65" r="3"/><circle cx="18.6" cy="31" r="3"/><circle cx="48" cy="14" r="3"/><circle cx="77.4" cy="31" r="3"/></g>
<circle class="f-plate s" cx="48" cy="48" r="17"/>
<g class="f-surf"><circle cx="59" cy="48" r="2.5"/><circle cx="51.4" cy="58.5" r="2.5"/><circle cx="39.1" cy="54.5" r="2.5"/><circle cx="39.1" cy="41.5" r="2.5"/><circle cx="51.4" cy="37.5" r="2.5"/></g>
<circle class="f-surf" cx="48" cy="48" r="4"/>
</svg><span class="w-name">Brake rotor</span><span class="w-course">Brakes</span><span class="w-tag">In 3D lab</span></div>

<div class="w-part"><svg viewBox="0 0 96 96" role="img" aria-label="Brake caliper">

<rect class="f-plate s" x="76" y="8" width="7" height="12" rx="2"/>
</svg><span class="w-name">Caliper</span><span class="w-course">Brakes</span></div>

<div class="w-part"><svg viewBox="0 0 96 96" role="img" aria-label="Brake pads">

<div class="w-part"><svg viewBox="0 0 96 96" role="img" aria-label="Wheel and tire">

<circle class="f-surf" cx="48" cy="15" r="4"/>

<div class="w-part"><svg viewBox="0 0 96 96" role="img" aria-label="Oil filter">

</svg><span class="w-name">Oil filter</span><span class="w-course">Oil &amp; Fluids</span></div>

<div class="w-part"><svg viewBox="0 0 96 96" role="img" aria-label="Spark plug">

<path class="f-brand" d="M19 52h58v22a9 9 0 0 1-9 9H28a9 9 0 0 1-9-9z"/>
<path class="l" d="M62 40h12M62 70h12"/>
</svg><span class="w-name">Coolant tank</span><span class="w-course">Cooling</span></div>

<div class="w-part"><svg viewBox="0 0 96 96" role="img" aria-label="Shock absorber">

<div class="w-part"><svg viewBox="0 0 96 96" role="img" aria-label="Transmission gear">
<g class="f-plate s">

<rect x="41" y="8" width="14" height="18" rx="3" transform="rotate(315 48 48)"/>
</g>
<circle class="f-plate" cx="48" cy="48" r="27"/>
<circle class="f-amber s" cx="48" cy="48" r="11"/>
</svg><span class="w-name">Gear</span><span class="w-course">Transmission</span></div>

</svg><span class="w-name">EV plug</span><span class="w-course">EV Basics</span></div>

</div>
