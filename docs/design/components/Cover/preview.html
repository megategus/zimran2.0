<!-- @dsCard height=288 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg)}
.cv{position:relative;width:960px;height:288px;background:var(--bg);overflow:hidden}
.cv svg{position:absolute;inset:0}
.b-brand{fill:var(--brand)}.b-amber{fill:var(--amber)}.b-ink{fill:var(--plate)}.b-brake{fill:var(--brake)}.b-tint{fill:var(--line)}
.arc{fill:none;stroke:var(--bg);stroke-width:8}
.t{position:absolute;left:40px;bottom:40px;max-width:440px;display:flex;flex-direction:column;gap:12px}
.n{margin:0;font:800 88px/.92 var(--font-display);color:var(--ink);letter-spacing:-1px}
.g{margin:0;font:400 14px/20px var(--font-body);color:var(--ink-muted)}
</style>
<div class="cv">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!-- blocks: brand 240x288 slab, amber 224x128, plate 144x144, brake 64x64, line 64x64 (space-8 = 64, gaps space-4 = 16)
     arrangement: one tall slab bleeding top and bottom with satellites stacked to its right, all right of x=480
     pattern: gauge arcs cut from the slab in ground; Wrenchly is about reading your car's dials and rotors, a literal motif
     steps and radii: space-4 gaps, space-8 squares, arcs every space-7 (48), radius-lg (20) on satellite corners -->
<rect class="b-brand" x="480" y="0" width="240" height="288"/>
<path class="arc" d="M480 240 A48 48 0 0 1 528 288"/>
<path class="arc" d="M480 192 A96 96 0 0 1 576 288"/>
<path class="arc" d="M480 144 A144 144 0 0 1 624 288"/>
<path class="arc" d="M480 96 A192 192 0 0 1 672 288"/>
<rect class="b-amber" x="736" y="-20" width="244" height="148" rx="20"/>
<rect class="b-ink" x="736" y="144" width="144" height="164" rx="20"/>
<rect class="b-brake" x="896" y="144" width="64" height="64" rx="20"/>
<rect class="b-tint" x="896" y="224" width="84" height="84" rx="20"/>
</svg>
<div class="t"><p class="n">Wrenchly</p><p class="g">Learn the car you actually drive.</p></div>
</div>
