<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body)}.w-wrap{padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}.w-label{font:600 13px/16px var(--font-body);letter-spacing:.6px;text-transform:uppercase}
.w-pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;width:100%;max-width:560px}
.w-plan{border-radius:var(--radius-lg);padding:24px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line)}
.w-hi{background:var(--plate);color:var(--on-plate);border-color:var(--plate)}
.w-plan h3{margin:0;font:700 18px/24px var(--font-display);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.w-save{background:var(--amber);color:var(--on-amber);padding:3px 8px;border-radius:var(--radius-sm);font-size:11px}
.w-price{font:700 24px/28px var(--font-mono)}.w-per{font:400 12px/16px var(--font-body)}
.w-plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.w-plan li::before{content:"\2713  ";color:var(--brand);font-weight:700}.w-hi li::before{color:inherit}
.w-btn{margin-top:auto;font:600 14px/1 var(--font-body);letter-spacing:.6px;text-transform:uppercase;padding:14px;border-radius:var(--radius-md);border:0;background:var(--brand);color:var(--on-brand);box-shadow:var(--press-brand);cursor:pointer}
.w-sec{background:var(--surface);color:var(--ink);border:2px solid var(--line-strong);box-shadow:var(--press-neutral)}
.w-cap{font-size:12px;color:var(--ink-muted);width:100%}</style>
<div class="w-wrap"><div class="w-pair">
<div class="w-plan"><h3>Monthly</h3><div><span class="w-price">$9.99</span> <span class="w-per">/ month</span></div><ul><li>All lessons for your car</li><li>AI Mechanic with photos</li><li>3D Brake Lab</li></ul><button class="w-btn w-sec">Choose monthly</button></div>
<div class="w-plan w-hi"><h3>Yearly <span class="w-label w-save">Save 50%</span></h3><div><span class="w-price">$59.99</span> <span class="w-per">/ year</span></div><ul><li>All lessons for your car</li><li>AI Mechanic with photos</li><li>3D Brake Lab</li></ul><button class="w-btn">Unlock Pro</button></div>
</div><span class="w-cap">Stripe test mode. No real charge.</span></div>
