<style>*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body)}.w-wrap{padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}.w-label{font:600 13px/16px var(--font-body);letter-spacing:.6px;text-transform:uppercase}
.w-safe{display:flex;gap:12px;max-width:560px;padding:16px;border-radius:var(--radius-md);background:var(--brake-soft);border:1px solid var(--brake)}
.w-safe svg{flex:none;color:var(--brake)}.w-safe div{display:flex;flex-direction:column;gap:4px}.w-safe .w-label{color:var(--brake)}
.w-safe p{margin:0;font-size:15px;line-height:24px}</style>

<div><span class="w-label">Safety</span><p>Support the car on jack stands, never on the jack alone. If the pedal feels soft after the job, do not drive. Have a shop bleed the brakes.</p></div>
