<style>*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body)}.w-wrap{padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}.w-label{font:600 13px/16px var(--font-body);letter-spacing:.6px;text-transform:uppercase}
.w-node{display:flex;flex-direction:column;align-items:center;gap:8px;width:120px;text-decoration:none;color:var(--ink);text-align:center}
.w-disc{width:72px;height:72px;border-radius:var(--radius-pill);display:grid;place-items:center;font:800 22px/1 var(--font-display)}
.w-cur .w-disc{background:var(--brand);color:var(--on-brand);box-shadow:var(--press-brand)}
.w-done .w-disc{background:var(--brand-soft);color:var(--brand)}
.w-lock .w-disc{background:var(--surface-sunken);color:var(--ink-muted)}
.w-soon .w-disc{border:2px dashed var(--line-strong);color:var(--ink-muted);font:600 12px/1 var(--font-body);letter-spacing:.6px;text-transform:uppercase}
.w-t{font:700 14px/18px var(--font-display)}.w-lock .w-t,.w-soon .w-t{color:var(--ink-muted)}</style>
