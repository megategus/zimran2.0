<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body)}.w-wrap{padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}.w-label{font:600 13px/16px var(--font-body);letter-spacing:.6px;text-transform:uppercase}
.w-btn{font:600 14px/1 var(--font-body);letter-spacing:.6px;text-transform:uppercase;padding:14px 20px;border-radius:var(--radius-md);border:0;cursor:pointer;transition:transform .12s ease-out,box-shadow .12s ease-out}
.w-btn:active{transform:translateY(4px);box-shadow:none}
.w-pri{background:var(--brand);color:var(--on-brand);box-shadow:var(--press-brand)}
.w-sec{background:var(--surface);color:var(--ink);border:2px solid var(--line-strong);box-shadow:var(--press-neutral)}
.w-pro{background:var(--plate);color:var(--on-plate);box-shadow:var(--press-neutral)}
.w-btn:disabled{background:var(--surface-sunken);color:var(--ink-muted);box-shadow:none;cursor:not-allowed;border:0}
@media (prefers-reduced-motion:reduce){.w-btn{transition:none}.w-btn:active{transform:none}}</style>
<div class="w-wrap">
<button class="w-btn w-pri">Start with my car</button>
<button class="w-btn w-sec">Try demo</button>
<button class="w-btn w-pro">Unlock Pro</button>
<button class="w-btn w-pri" disabled>Check answer</button>
</div>
