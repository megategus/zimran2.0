<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body)}.w-wrap{padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}.w-label{font:600 13px/16px var(--font-body);letter-spacing:.6px;text-transform:uppercase}
.w-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;width:100%;max-width:640px}
.w-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-pill);font:700 18px/24px var(--font-mono);font-variant-numeric:tabular-nums}
.w-streak{background:var(--amber);color:var(--on-amber)}.w-xp{background:var(--surface);border:1px solid var(--line);color:var(--amber-ink)}
.w-pro{background:var(--plate);color:var(--on-plate);font:600 12px/16px var(--font-body);letter-spacing:.6px;text-transform:uppercase}
.w-demo{background:var(--amber);color:var(--on-amber);padding:4px 8px;border-radius:var(--radius-sm)}
.w-track{width:100%;max-width:640px;height:10px;border-radius:var(--radius-pill);background:var(--surface-sunken);overflow:hidden}.w-fill{height:100%;width:66%;background:var(--brand);border-radius:inherit}</style>
<div class="w-wrap">
<div class="w-bar">
<span class="w-chip w-streak"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg>7</span>
<span class="w-chip w-xp">1,240 XP</span>
<span class="w-chip w-pro">Pro</span>
<span class="w-label w-demo">Demo</span>
</div>
<div class="w-track" role="progressbar" aria-valuenow="2" aria-valuemin="0" aria-valuemax="3" aria-label="Lesson progress"><div class="w-fill"></div></div>
</div>
