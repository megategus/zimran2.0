<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body)}.w-wrap{padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}.w-label{font:600 13px/16px var(--font-body);letter-spacing:.6px;text-transform:uppercase}
.w-car{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:16px}
.w-car h2{margin:0;font:800 22px/28px var(--font-display)}
.w-specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;background:var(--surface-sunken);border-radius:var(--radius-md);padding:12px 16px}
.w-specs div{display:flex;flex-direction:column;gap:2px;min-width:0}.w-specs .w-label{color:var(--ink-muted);font-size:11px}.w-specs b{font:500 14px/20px var(--font-mono);overflow-wrap:anywhere}
.w-rec{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:10px 12px;border-radius:var(--radius-sm);background:var(--brake-soft)}
.w-rec .w-label{color:var(--brake)}.w-rec code{font:500 13px/18px var(--font-mono)}
.w-cap{font-size:12px;color:var(--ink-muted)}</style>
<div class="w-wrap"><section class="w-car">
<h2>2019 Honda Civic EX</h2>
<div class="w-specs"><div><span class="w-label">VIN</span><b>2HGFC2F59KH512345</b></div><div><span class="w-label">Engine</span><b>1.5L I4 turbo</b></div><div><span class="w-label">Drive</span><b>FWD · CVT</b></div></div>
<div class="w-rec"><span class="w-label">Recall</span><code>19V-000</code><span>Example recall row</span></div>
<span class="w-cap">Specs and recalls from NHTSA. Sample data.</span>
</section></div>
